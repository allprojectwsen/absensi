<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Absensi</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

h1{
  margin-bottom:5px;
}

.tanggal-box{
  background:white;
  padding:15px;
  border-radius:12px;
  margin:20px 0;
}

input{
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

button{
  padding:10px 15px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  background:#222;
  color:white;
  margin-left:5px;
}

.statistik{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;
  margin-bottom:20px;
}

.card{
  background:white;
  padding:18px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h3{
  margin:0 0 8px;
  font-size:15px;
}

.angka{
  font-size:28px;
  font-weight:bold;
}

.section{
  background:white;
  padding:18px;
  border-radius:12px;
  margin-top:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.section h2{
  margin-top:0;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
  text-align:left;
}

th{
  background:#f1f1f1;
}

.kosong{
  padding:15px;
  color:#666;
}

.belum{
  color:#d32f2f;
  font-weight:bold;
}

.status-hadir{
  color:green;
  font-weight:bold;
}

.status-izin{
  color:#d68b00;
  font-weight:bold;
}

.status-sakit{
  color:#1976d2;
  font-weight:bold;
}

.status-alpa{
  color:#d32f2f;
  font-weight:bold;
}

@media(max-width:600px){

  .container{
    padding:12px;
  }

  table{
    font-size:13px;
  }

  th,td{
    padding:8px;
  }

  button{
    margin-top:8px;
    margin-left:0;
  }

}

</style>
</head>

<body>

<div class="container">

<h1>📊 Dashboard Absensi</h1>

<div id="infoTanggal"></div>

<div class="tanggal-box">

<label>Pilih tanggal:</label>

<input
  type="date"
  id="tanggal"
>

<button onclick="loadDashboard()">
  Tampilkan
</button>

</div>


<!-- STATISTIK -->

<div class="statistik">

<div class="card">
<h3>Total Siswa</h3>
<div class="angka" id="totalSiswa">0</div>
</div>

<div class="card">
<h3>Hadir</h3>
<div class="angka" id="hadir">0</div>
</div>

<div class="card">
<h3>Izin</h3>
<div class="angka" id="izin">0</div>
</div>

<div class="card">
<h3>Sakit</h3>
<div class="angka" id="sakit">0</div>
</div>

<div class="card">
<h3>Alpa</h3>
<div class="angka" id="alpa">0</div>
</div>

<div class="card">
<h3>Belum Absen</h3>
<div class="angka" id="belumAbsen">0</div>
</div>

</div>


<!-- BELUM ABSEN -->

<div class="section">

<h2>🔴 Daftar Belum Absen</h2>

<div id="daftarBelumAbsen">
Memuat data...
</div>

</div>


<!-- ABSENSI -->

<div class="section">

<h2>📋 Daftar Absensi</h2>

<div id="daftarAbsensi">
Memuat data...
</div>

</div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwCLZrt29EQ_CTT11r9OC0EKha4wajjnTEYR9wzTicyGi93zf-xRtDnR770q1tqw9C9/exec";

const ADMIN_PIN =
"123456";


// ======================================================
// TANGGAL HARI INI
// ======================================================

function tanggalHariIni(){

  const d=new Date();

  return(
    d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0")
  );

}


// ======================================================
// REQUEST API
// ======================================================

async function requestAPI(data){

  const response=await fetch(
    API_URL,
    {
      method:"POST",
      body:JSON.stringify(data)
    }
  );

  return await response.json();

}


// ======================================================
// LOAD DASHBOARD
// ======================================================

async function loadDashboard(){

  const tanggal=
    document.getElementById("tanggal").value;

  if(!tanggal){

    alert("Pilih tanggal terlebih dahulu.");

    return;

  }

  document.getElementById(
    "daftarBelumAbsen"
  ).innerHTML="Memuat data...";

  document.getElementById(
    "daftarAbsensi"
  ).innerHTML="Memuat data...";


  try{

    // AMBIL DATA DASHBOARD
    const dashboard=
      await requestAPI({

        action:"getDashboard",

        pin:ADMIN_PIN,

        tanggal:tanggal

      });


    if(!dashboard.success){

      throw new Error(
        dashboard.message ||
        "Gagal mengambil dashboard."
      );

    }


    // AMBIL SEMUA SISWA
    const siswaData=
      await requestAPI({

        action:"getStudents",

        pin:ADMIN_PIN

      });


    if(!siswaData.success){

      throw new Error(
        siswaData.message ||
        "Gagal mengambil data siswa."
      );

    }


    tampilkanStatistik(
      dashboard
    );


    tampilkanBelumAbsen(
      siswaData.students || [],
      dashboard.absensi || []
    );


    tampilkanAbsensi(
      dashboard.absensi || []
    );


  }catch(error){

    document.getElementById(
      "daftarBelumAbsen"
    ).innerHTML=
      "<p>❌ "+escapeHtml(error.message)+"</p>";

    document.getElementById(
      "daftarAbsensi"
    ).innerHTML=
      "<p>❌ Gagal mengambil data.</p>";

  }

}


// ======================================================
// STATISTIK
// ======================================================

function tampilkanStatistik(data){

  const s=data.statistik;

  document.getElementById(
    "totalSiswa"
  ).textContent=s.totalSiswa;

  document.getElementById(
    "hadir"
  ).textContent=s.hadir;

  document.getElementById(
    "izin"
  ).textContent=s.izin;

  document.getElementById(
    "sakit"
  ).textContent=s.sakit;

  document.getElementById(
    "alpa"
  ).textContent=s.alpa;

  document.getElementById(
    "belumAbsen"
  ).textContent=s.belumAbsen;

}


// ======================================================
// DAFTAR BELUM ABSEN
// ======================================================

function tampilkanBelumAbsen(
  siswa,
  absensi
){

  const sudahAbsen={};


  absensi.forEach(function(item){

    sudahAbsen[
      String(item.id).trim()
    ]=true;

  });


  const belum=siswa.filter(
    function(item){

      return !sudahAbsen[
        String(item.id).trim()
      ];

    }
  );


  const container=
    document.getElementById(
      "daftarBelumAbsen"
    );


  if(belum.length===0){

    container.innerHTML=
      "<div class='kosong'>"+
      "✅ Semua siswa sudah absen."+
      "</div>";

    return;

  }


  let html=
    "<table>"+
    "<tr>"+
    "<th>No</th>"+
    "<th>Nama</th>"+
    "<th>Kelas</th>"+
    "</tr>";


  belum.forEach(
    function(item,index){

      html+=
        "<tr>"+
        "<td>"+(index+1)+"</td>"+
        "<td class='belum'>"+
        escapeHtml(item.nama)+
        "</td>"+
        "<td>"+
        escapeHtml(item.kelas)+
        "</td>"+
        "</tr>";

    }
  );


  html+="</table>";

  container.innerHTML=html;

}


// ======================================================
// DAFTAR ABSENSI
// ======================================================

function tampilkanAbsensi(absensi){

  const container=
    document.getElementById(
      "daftarAbsensi"
    );


  if(absensi.length===0){

    container.innerHTML=
      "<div class='kosong'>"+
      "Belum ada siswa yang absen."+
      "</div>";

    return;

  }


  let html=
    "<table>"+
    "<tr>"+
    "<th>No</th>"+
    "<th>Nama</th>"+
    "<th>Kelas</th>"+
    "<th>Status</th>"+
    "<th>Jam</th>"+
    "</tr>";


  absensi.forEach(
    function(item,index){

      const status=
        String(item.status || "");

      const classStatus=
        "status-"+
        status.toLowerCase();


      html+=
        "<tr>"+
        "<td>"+(index+1)+"</td>"+
        "<td>"+
        escapeHtml(item.nama)+
        "</td>"+
        "<td>"+
        escapeHtml(item.kelas)+
        "</td>"+
        "<td class='"+classStatus+"'>"+
        escapeHtml(status)+
        "</td>"+
        "<td>"+
        escapeHtml(item.jam)+
        "</td>"+
        "</tr>";

    }
  );


  html+="</table>";

  container.innerHTML=html;

}


// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHtml(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


// ======================================================
// TANGGAL DEFAULT
// ======================================================

document.getElementById(
  "tanggal"
).value=
  tanggalHariIni();


// ======================================================
// LOAD OTOMATIS
// ======================================================

loadDashboard();

</script>

</body>
</html>
