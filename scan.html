<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan Absensi</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>📷 Scan Absensi</h1>

    <p>Arahkan kamera ke QR Code siswa</p>

    <div id="reader" style="width:100%;"></div>

    <div id="hasil">
      Silakan scan QR siswa.
    </div>

  </div>


  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwCLZrt29EQ_CTT11r9OC0EKha4wajjnTEYR9wzTicyGi93zf-xRtDnR770q1tqw9C9/exec";


    let sudahScan = false;


    // ==========================================
    // KIRIM DATA KE GOOGLE APPS SCRIPT
    // ==========================================

    async function kirim(data) {

      const response = await fetch(API_URL, {

        method: "POST",

        body: JSON.stringify(data)

      });

      return await response.json();

    }


    // ==========================================
    // SETELAH QR BERHASIL DIBACA
    // ==========================================

    async function prosesQR(qrText) {

      if (sudahScan) return;

      sudahScan = true;


      const hasil =
        document.getElementById("hasil");


      hasil.innerHTML =
        "⏳ Mencari data siswa...";


      try {

        // PENTING:
        // Menggunakan action yang memang ada
        // di Code.gs kamu yaitu "cariSiswa"

        const data = await kirim({

          action: "cariSiswa",

          id: qrText

        });


        if (!data.success) {

          hasil.innerHTML = `

            <h2>❌ Siswa Tidak Ditemukan</h2>

            <p>${data.message}</p>

            <p>ID QR:</p>

            <b>${qrText}</b>

            <br><br>

            <button onclick="scanLagi()">
              📷 Scan Lagi
            </button>

          `;

          sudahScan = false;

          return;

        }


        // ======================================
        // SISWA DITEMUKAN
        // ======================================

        hasil.innerHTML = `

          <h2>✅ Siswa Ditemukan</h2>

          <p>
            <b>ID:</b><br>
            ${data.id}
          </p>

          <p>
            <b>Nama:</b><br>
            ${data.nama}
          </p>

          <p>
            <b>Kelas:</b><br>
            ${data.kelas}
          </p>

          <hr>

          <h3>Pilih Status</h3>

          <button onclick="absen('${data.id}', 'Hadir')">
            ✅ HADIR
          </button>

          <button onclick="absen('${data.id}', 'Izin')">
            📝 IZIN
          </button>

          <button onclick="absen('${data.id}', 'Sakit')">
            🤒 SAKIT
          </button>

          <button onclick="absen('${data.id}', 'Alpa')">
            ❌ ALPA
          </button>

        `;


      } catch (error) {

        hasil.innerHTML = `

          <h2>❌ Gagal Terhubung</h2>

          <p>
            Tidak dapat terhubung ke server.
          </p>

          <button onclick="scanLagi()">
            📷 Scan Lagi
          </button>

        `;

        sudahScan = false;

      }

    }


    // ==========================================
    // SIMPAN ABSENSI
    // ==========================================

    async function absen(id, status) {

      const hasil =
        document.getElementById("hasil");


      hasil.innerHTML =
        "⏳ Menyimpan absensi...";


      try {

        // PENTING:
        // Code.gs menggunakan action "absensi"

        const data = await kirim({

          action: "absensi",

          id: id,

          status: status

        });


        // ======================================
        // ABSEN BERHASIL
        // ======================================

        if (data.success) {

          hasil.innerHTML = `

            <h2>✅ ABSENSI BERHASIL</h2>

            <p>
              <b>Nama:</b><br>
              ${data.nama}
            </p>

            <p>
              <b>Kelas:</b><br>
              ${data.kelas}
            </p>

            <p>
              <b>Status:</b><br>
              ${data.status}
            </p>

            <p>
              <b>Tanggal:</b><br>
              ${data.tanggal}
            </p>

            <p>
              <b>Jam:</b><br>
              ${data.jam} WIB
            </p>

            <br>

            <button onclick="scanLagi()">
              📷 SCAN SISWA BERIKUTNYA
            </button>

          `;

        }

        // ======================================
        // ABSEN GANDA
        // ======================================

        else if (data.duplicate) {

          hasil.innerHTML = `

            <h2>⚠️ SUDAH ABSEN</h2>

            <p>
              ${data.message}
            </p>

            <br>

            <button onclick="scanLagi()">
              📷 SCAN SISWA BERIKUTNYA
            </button>

          `;

        }

        // ======================================
        // ERROR LAIN
        // ======================================

        else {

          hasil.innerHTML = `

            <h2>❌ Gagal</h2>

            <p>
              ${data.message}
            </p>

            <br>

            <button onclick="scanLagi()">
              📷 Scan Lagi
            </button>

          `;

          sudahScan = false;

        }


      } catch (error) {

        hasil.innerHTML = `

          <h2>❌ Gagal menyimpan</h2>

          <p>
            Terjadi kesalahan saat menyimpan absensi.
          </p>

          <button onclick="scanLagi()">
            📷 Scan Lagi
          </button>

        `;

        sudahScan = false;

      }

    }


    // ==========================================
    // SCAN LAGI
    // ==========================================

    function scanLagi() {

      location.reload();

    }


    // ==========================================
    // JALANKAN QR SCANNER
    // ==========================================

    const scanner =
      new Html5QrcodeScanner(

        "reader",

        {

          fps: 10,

          qrbox: {

            width: 250,

            height: 250

          }

        },

        false

      );


    scanner.render(prosesQR);

  </script>

</body>
</html>
